name: Release

# Push a tag like v0.5.7 to publish:
#   - ghcr.io/wizz666/nestward:0.5.7 and :latest (amd64 + arm64)
#   - static binaries for Linux amd64 and arm64 on the GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Binaries
        run: |
          make cross VERSION="$VERSION"
          cd dist && sha256sum nestward-linux-* > SHA256SUMS

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/wizz666/nestward:${{ env.VERSION }}
            ghcr.io/wizz666/nestward:latest
          labels: |
            org.opencontainers.image.source=https://github.com/wizz666/nestward
            org.opencontainers.image.description=Nestward – an ops layer for the home server you already have
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/nestward-linux-* dist/SHA256SUMS \
            --title "Nestward $VERSION" --generate-notes
