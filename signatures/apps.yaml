# Apps Nestward recognises in running containers (MIT, see LICENSE).
#
# Matching, in order:
#   images:   full repository after removing registry, tag and "library/"
#             (lscr.io/linuxserver/plex:latest -> linuxserver/plex)
#   prefixes: repository starts with this
#   aliases:  last part of the repository, after removing "arch-" and
#             "docker-" in front (binhex/arch-emby -> emby). The id is
#             always an alias.
# port/path/scheme: where the web page usually is inside the container.
# login: own = the app has its own login, none = open to anyone who can
#        reach it (Nestward will warn before publishing those).
# role: support = a helper of another app (database, cache, part of a stack).
# profile: id of the hardware profile in profiles/, if there is one.

apps:
